name: Verify test-only reporting agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Guard against production IDs and sending code
        run: npm run safety
      - name: Bundle exact source
        run: npm run build
